; Abuse Report Desk — PHP settings for the container

memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 40M
max_execution_time = 120
max_input_time = 120

; Reports and tickets contain long text; never truncate silently.
default_charset = "UTF-8"

; Hide internals from responses.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED

; Sessions are the only state outside PostgreSQL.
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

date.timezone = UTC
allow_url_fopen = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
